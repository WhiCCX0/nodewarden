name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[kv_namespaces]]
binding = "ATTACHMENTS_KV"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]

# Preview resources are deliberately separate from production password vault data.
# Previews have their own Durable Object namespaces (provisioned by Cloudflare).
[previews]

[previews.assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[[previews.d1_databases]]
binding = "DB"
database_name = "nodewarden-preview-db"
database_id = "40b5042d-f690-458f-acb7-d79ccee59b05"

[[previews.kv_namespaces]]
binding = "ATTACHMENTS_KV"
id = "8e7543068f604938b4641bcb25d9b49d"

[[previews.durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[previews.durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"
