name: Weekly upstream sync

# Tuesday 03:00 in Taiwan (UTC+8) = Monday 19:00 UTC.
on:
  schedule:
    - cron: "0 19 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodewarden-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up the repository's Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm

      - name: Merge upstream without discarding fork changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already included; no deployment needed."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merge conflict; fork and production remain unchanged."
            exit 1
          fi

          if ! git diff --quiet "$base" HEAD -- wrangler.kv.toml .github/workflows/weekly-upstream-sync.yml; then
            echo "::error::Upstream changed deployment settings or the sync workflow; manual review required."
            exit 1
          fi

          git diff --check "$base" HEAD
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Verify merged source before updating production
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run test:config-compatibility
          npm run test:web-crypto
          npm run test:vault-compatibility
          npm run test:notifications-security
          npm run test:webauthn-connectors
          npm audit --omit=dev --audit-level=high

      - name: Update fork and trigger Cloudflare deployment
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        run: git push origin HEAD:main
